[tox]
min_version = 4.3.3
isolated_build = true
envlist =
    py3{10,11,12,13,14,15}
    flake8
    format
    bandit
    mypy
    deptry
    pypi

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, flake8, format, bandit, mypy, deptry, pypi
    3.15: py315

[base]
python = python3.14
package = wattnet.client
src_path = wattnet

[testenv]
usedevelop = true
allowlist_externals =
    poetry
    find
setenv =
    VIRTUAL_ENV={envdir}
    LC_ALL=en_US.utf-8
commands_pre =
    poetry -V
    poetry sync --no-root --with test --no-interaction
commands =
    find . -type f -name "*.pyc" -delete
    poetry run pytest tests/unit -v --cov=wattnet --cov-report=term-missing --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

[testenv:py310]
basepython = python3.10

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[testenv:py313]
basepython = python3.13

[testenv:py314]
basepython = python3.14

[testenv:py315]
basepython = python3.15

[flake8]
max-line-length = 88
show-source = true
builtins = _
min-python-version = 3.10
exclude =
    .venv
    .git
    .tox
    env
    dist
    docs
    build
    *lib/python*
    *egg

[testenv:flake8]
skip_install = true
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --only lint --no-interaction
commands =
    poetry run flake8 {[base]src_path}

[testenv:format]
skip_install = true
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --only format --no-interaction
commands =
    poetry run isort --check --diff {[base]src_path}
    poetry run black --check --diff {[base]src_path}

[testenv:bandit]
skip_install = true
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --only security --no-interaction
commands =
    poetry run bandit -r {[base]src_path}

[testenv:mypy]
description = Static type checks
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --with types --no-interaction
commands =
    poetry run mypy -p {[base]package}

[testenv:integration]
description = Integration tests against a real wattnet-api instance
basepython = {[base]python}
allowlist_externals =
    poetry
setenv =
    VIRTUAL_ENV={envdir}
    LC_ALL=en_US.utf-8
commands_pre =
    poetry sync --no-root --with test --no-interaction
commands =
    poetry run pytest tests/integration/ -v --tb=short

[testenv:deptry]
description = Check for unused, missing, or transitive dependencies
usedevelop = true
basepython = {[base]python}
deps = deptry>=0.23
commands_pre =
commands =
    deptry {[base]src_path}

[testenv:pypi]
description = Dry-run PyPI publish
skip_install = true
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --only release --no-interaction
commands =
    poetry build
    poetry publish --dry-run --no-interaction
